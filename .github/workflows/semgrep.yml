name: Semgrep

# Markdown-only changes skip this scan; CI still scans every change
# for secrets. Most of the run time is Semgrep's own config fetch, rule
# loading, and Pro scan.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - LICENSE
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  # Connected Semgrep Pro scan: Code (Pro rules), Supply Chain, and Secrets.
  # The official image, pinned by digest, skips Python setup and pip install.
  # Keep its tag equal to the semgrep pin in .tool-versions.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0 # semgrep ci is diff-aware
      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Assert tested source identity
        id: identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
          printf 'Tested SHA: %s; run: %s; attempt: %s\n' "$actual" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - name: Require a trusted connected scan
        env:
          TRUSTED_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          SEMGREP_APP_TOKEN: ''
        run: |
          if [ "$TRUSTED_SOURCE" != true ]; then
            echo "Connected Semgrep requires a reviewed same-repository branch" >&2
            exit 1
          fi
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "Connected Semgrep requires SEMGREP_APP_TOKEN" >&2
            exit 1
          fi
          semgrep ci --code --supply-chain --secrets --no-suppress-errors
