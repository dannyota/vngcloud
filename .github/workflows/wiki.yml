name: Wiki

# Publication is disabled. Every event renders a read-only preview.
on:
  pull_request:
    branches: [master]
    paths:
      - docs/wiki/**
      - scripts/wiki-sync.sh
      - scripts/test-wiki-publication.py
      - .github/workflows/wiki.yml
      - scripts/ci-evidence.py
      - scripts/test-ci-evidence.py
  push:
    branches: [master]
    paths:
      - docs/wiki/**
      - scripts/wiki-sync.sh
      - scripts/test-wiki-publication.py
      - .github/workflows/wiki.yml
      - scripts/ci-evidence.py
      - scripts/test-ci-evidence.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert tested source identity
        id: identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          TESTED_SHA="$actual" python3 - <<'PYTHON'
          import json
          import os
          import re

          record = {
              "version": 2,
              "repository": "dannyota/vngcloud",
              "workflow": ".github/workflows/wiki.yml",
              "job": "preview",
              "matrix": {},
              "tested_sha": os.environ["TESTED_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
          }
          assert all(re.fullmatch(r"[0-9a-f]{40}", record[key]) for key in ("tested_sha", "workflow_sha"))
          assert record["run_id"] > 0 and record["run_attempt"] > 0
          message = json.dumps(record, separators=(",", ":"), ensure_ascii=False)
          assert len(message.encode("utf-8")) <= 2048
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=vngcloud-source-identity::" + message)
          PYTHON
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
          printf 'Tested SHA: %s; run: %s; attempt: %s\n' "$actual" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - run: bash scripts/wiki-sync.sh --dry-run
