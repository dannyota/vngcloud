name: CI

# Mandatory jobs run in parallel. Semgrep has its own path-filtered workflow.
# Tool versions come from .tool-versions; scripts/tools-outdated.sh and the
# Tools workflow keep them current.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  # Own cache: race builds differ from the lint and security jobs' builds,
  # which would otherwise win the shared setup-go cache key.
  go:
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert tested source identity
        id: identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
          printf 'Tested SHA: %s; run: %s; attempt: %s\n' "$actual" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ hashFiles('go.mod', '**/*.go') }}
          restore-keys: go-race-
      - name: Workflow policy regressions
        run: python3 scripts/test-ci-workflows.py
      - name: Connected Semgrep coverage regressions
        run: python3 scripts/test-semgrep-connected.py
      - run: go test -race ./...
      - if: ${{ !cancelled() }}
        run: go vet ./... && go vet -tags live ./... && go vet -tags livewrite ./...
      - if: ${{ !cancelled() }}
        name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - if: ${{ !cancelled() }}
        run: bash scripts/check-lengths.sh
      - if: ${{ !cancelled() }}
        name: SDK packages import no CLI dependency
        run: bash scripts/check-sdk-deps.sh
      - if: ${{ !cancelled() }}
        name: Windows and macOS builds compile
        run: GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - if: ${{ !cancelled() }}
        name: Generated CLI docs are current
        run: |
          go run ./cmd/vngcloud gen-docs docs/wiki
          test -z "$(git status --porcelain -- docs/wiki)" || { git status --porcelain -- docs/wiki; exit 1; }
      - if: ${{ !cancelled() }}
        run: bash scripts/wiki-sync.sh --dry-run

  lint:
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert tested source identity
        id: identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
          printf 'Tested SHA: %s; run: %s; attempt: %s\n' "$actual" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Read the golangci-lint pin
        run: echo "GOLANGCI_LINT=v$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT }}

  # go install verifies each tool against the Go checksum database. The built
  # binaries are cached per version, so most runs skip the build.
  security:
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans full history
      - name: Assert tested source identity
        id: identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"
          printf 'Tested SHA: %s; run: %s; attempt: %s\n' "$actual" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Read tool pins
        run: |
          echo "GITLEAKS=$(awk '$1 == "gitleaks" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"
          echo "GOVULNCHECK=$(awk '$1 == "govulncheck" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"
      - id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tools
          key: tools-go${{ hashFiles('go.mod') }}-gitleaks${{ env.GITLEAKS }}-govulncheck${{ env.GOVULNCHECK }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: |
          GOBIN="$HOME/tools" go install "github.com/zricethezav/gitleaks/v8@v$GITLEAKS"
          GOBIN="$HOME/tools" go install "golang.org/x/vuln/cmd/govulncheck@v$GOVULNCHECK"
      - run: ~/tools/gitleaks detect --redact --no-banner
      - if: ${{ !cancelled() }}
        run: ~/tools/govulncheck ./...

  required:
    name: CI required
    if: ${{ always() }}
    needs: [go, lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful jobs on the expected source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = {"go", "lint", "security"}
          if set(needs) != expected:
              sys.exit("Mandatory CI job set differs from the expected set")
          for name in sorted(expected):
              job = needs[name]
              if job.get("result") != "success":
                  sys.exit(f"Mandatory CI job {name} did not succeed")
              if job.get("outputs", {}).get("tested_sha") != os.environ["EXPECTED_SHA"]:
                  sys.exit(f"Mandatory CI job {name} tested the wrong SHA")
          print("All mandatory CI jobs succeeded on the expected SHA")
          PYTHON
